name: pristine_cleaner
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-pristine_cleaner: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.pristine_cleaner # adjust accordingly to your app name

apps:
  pristine_cleaner:
    command: pristine_cleaner
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-pristine_cleaner
parts:
  pristine_cleaner:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
