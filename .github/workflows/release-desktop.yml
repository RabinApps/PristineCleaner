name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/update on GitHub Releases"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FASTFORGE_VERSION: 0.6.6

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS dmg
            runner: macos-latest
            release_name: desktop-macos
          - label: Windows exe/msix
            runner: windows-latest
            release_name: desktop-windows
          - label: Linux x86_64 deb/rpm
            runner: ubuntu-latest
            release_name: desktop-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            dpkg-dev \
            fakeroot \
            file \
            libgtk-3-dev \
            ninja-build \
            patchelf \
            pkg-config \
            rpm

      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: npm install -g appdmg

      - name: Install Fastforge
        run: dart pub global activate fastforge $FASTFORGE_VERSION

      - name: Add pub cache to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$LOCALAPPDATA\\Pub\\Cache\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compute release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Import macOS codesign certificate
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}

      - name: Install Provisioning Profile
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        shell: bash
        run: |
          PP_FOLDER="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_FOLDER"
          echo "${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}" | base64 --decode > "$PP_FOLDER/macos_profile.provisionprofile"

      - name: Build release assets
        run: fastforge release --name ${{ matrix.release_name }} --skip-clean

      - name: Notarize macOS DMG
        id: notarize_macos_dmg
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        timeout-minutes: 60
        shell: bash
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PRISTINE_CLEANER_WORKER_URL: ${{ secrets.PRISTINE_CLEANER_WORKER_URL }}
          PRISTINE_CLEANER_WORKER_SECRET: ${{ secrets.PRISTINE_CLEANER_WORKER_SECRET }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          if [[ -z "$PRISTINE_CLEANER_WORKER_URL" ]]; then
            echo "Missing required secret PRISTINE_CLEANER_WORKER_URL"
            exit 1
          fi

          if [[ -z "$PRISTINE_CLEANER_WORKER_SECRET" ]]; then
            echo "Missing required secret PRISTINE_CLEANER_WORKER_SECRET"
            exit 1
          fi

          DMG_PATH="$(find dist -type f -name '*.dmg' | head -n 1 || true)"

          if [[ -z "$DMG_PATH" ]]; then
            echo "Could not find DMG artifact in dist/ to notarize"
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          MOUNT_DIR="$TEMP_DIR/mount"
          EXTRACT_DIR="$TEMP_DIR/extracted"
          mkdir -p "$MOUNT_DIR" "$EXTRACT_DIR"

          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet >/dev/null 2>&1 || true
            rm -rf "$TEMP_DIR"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          APP_PATH="$(find "$MOUNT_DIR" -maxdepth 1 -type d -name '*.app' | head -n 1 || true)"

          if [[ -z "$APP_PATH" ]]; then
            echo "Could not find .app bundle inside DMG"
            exit 1
          fi

          cp -R "$APP_PATH" "$EXTRACT_DIR/"
          hdiutil detach "$MOUNT_DIR" -quiet

          APP_PATH="$(find "$EXTRACT_DIR" -maxdepth 1 -type d -name '*.app' | head -n 1 || true)"
          APP_EXECUTABLE="$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -n 1 || true)"

          if [[ -z "$APP_EXECUTABLE" ]]; then
            echo "Could not find app executable in $APP_PATH"
            exit 1
          fi

          /usr/bin/codesign \
            --force \
            --deep \
            --sign "$MACOS_CERTIFICATE_NAME" \
            --options runtime \
            --timestamp \
            --entitlements "macos/Runner/Release.entitlements" \
            --verbose \
            "$APP_PATH"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          APP_SIGNATURE_INFO="$(/usr/bin/codesign -dv --verbose=4 "$APP_EXECUTABLE" 2>&1)"
          echo "$APP_SIGNATURE_INFO"

          if ! echo "$APP_SIGNATURE_INFO" | grep -Eq 'flags=.*runtime'; then
            echo "Hardened runtime flag missing from app executable signature"
            exit 1
          fi

          if ! echo "$APP_SIGNATURE_INFO" | grep -q 'Timestamp='; then
            echo "Secure timestamp missing from app executable signature"
            exit 1
          fi

          APP_ENTITLEMENTS="$(/usr/bin/codesign -d --entitlements - "$APP_EXECUTABLE" 2>&1 || true)"
          echo "$APP_ENTITLEMENTS"

          if echo "$APP_ENTITLEMENTS" | grep -q 'com.apple.security.get-task-allow'; then
            echo "Debug entitlement com.apple.security.get-task-allow must not be present in release app"
            exit 1
          fi

          APP_BASENAME="$(basename "$APP_PATH" .app)"
          REPACKED_DMG_PATH="$TEMP_DIR/${APP_BASENAME}.dmg"

          rm -f "$DMG_PATH"
          hdiutil create \
            -volname "$APP_BASENAME" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "$REPACKED_DMG_PATH"

          mv "$REPACKED_DMG_PATH" "$DMG_PATH"

          /usr/bin/codesign \
            --force \
            --sign "$MACOS_CERTIFICATE_NAME" \
            --timestamp \
            --verbose \
            "$DMG_PATH"

          WEBHOOK_URL="$PRISTINE_CLEANER_WORKER_URL"
          if [[ "$WEBHOOK_URL" != *\?* ]]; then
            WEBHOOK_URL="$WEBHOOK_URL?"
          elif [[ "$WEBHOOK_URL" != *[\?\&] ]]; then
            WEBHOOK_URL="$WEBHOOK_URL&"
          fi

          ENCODED_RUN_ID="$(/usr/bin/python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$CURRENT_RUN_ID")"
          ENCODED_TAG="$(/usr/bin/python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$CURRENT_RELEASE_TAG")"
          ENCODED_SECRET="$(/usr/bin/python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$PRISTINE_CLEANER_WORKER_SECRET")"

          NOTARY_WEBHOOK_URL="${WEBHOOK_URL}run_id=${ENCODED_RUN_ID}&tag=${ENCODED_TAG}&secret=${ENCODED_SECRET}"

          NOTARY_SUBMISSION_JSON="$(xcrun notarytool submit \
            "$DMG_PATH" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --webhook "$NOTARY_WEBHOOK_URL" \
            --no-wait \
            --output-format json)"

          echo "$NOTARY_SUBMISSION_JSON"

          NOTARY_SUBMISSION_ID="$(echo "$NOTARY_SUBMISSION_JSON" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')"

          if [[ -z "$NOTARY_SUBMISSION_ID" ]]; then
            echo "Unable to read notarization submission id"
            exit 1
          fi

          echo "Notary submission id: $NOTARY_SUBMISSION_ID"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload unnotarized macOS DMG artifact
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        uses: actions/upload-artifact@v4
        with:
          name: unnotarized-dmg
          path: ${{ steps.notarize_macos_dmg.outputs.dmg_path }}
          if-no-files-found: error

      - name: Remove unstapled macOS DMG from release upload set
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        shell: bash
        run: |
          find dist -type f -name '*.dmg' -delete

      - name: Append x86_64 suffix to Linux artifact names
        if: runner.os == 'Linux' && matrix.release_name == 'desktop-linux-x64'
        shell: bash
        run: |
          find dist -type f \( -name '*.deb' -o -name '*.rpm' \) -print0 |
            while IFS= read -r -d '' file; do
              mv "$file" "${file%.*}-x86_64.${file##*.}"
            done

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
