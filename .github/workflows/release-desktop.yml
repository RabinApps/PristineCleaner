name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/update on GitHub Releases"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FASTFORGE_VERSION: 0.6.6

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS dmg
            runner: macos-latest
            release_name: desktop-macos
          - label: Windows exe/msix
            runner: windows-latest
            release_name: desktop-windows
          - label: Linux x86_64 deb/rpm
            runner: ubuntu-latest
            release_name: desktop-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            dpkg-dev \
            fakeroot \
            file \
            libgtk-3-dev \
            ninja-build \
            patchelf \
            pkg-config \
            rpm

      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: npm install -g appdmg

      - name: Install Fastforge
        run: dart pub global activate fastforge $FASTFORGE_VERSION

      - name: Add pub cache to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$LOCALAPPDATA\\Pub\\Cache\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compute release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Import macOS codesign certificate
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}

      - name: Build release assets
        run: fastforge release --name ${{ matrix.release_name }} --skip-clean

      - name: Notarize macOS DMG
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        run: |
          set -euo pipefail

          DMG_PATH="$(find dist -type f -name '*.dmg' | head -n 1 || true)"

          if [[ -z "$DMG_PATH" ]]; then
            echo "Could not find DMG artifact in dist/ to notarize"
            exit 1
          fi

          /usr/bin/codesign \
            --force \
            --sign "$MACOS_CERTIFICATE_NAME" \
            --options runtime \
            --verbose \
            "$DMG_PATH"

          xcrun notarytool submit \
            "$DMG_PATH" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Append x86_64 suffix to Linux artifact names
        if: runner.os == 'Linux' && matrix.release_name == 'desktop-linux-x64'
        shell: bash
        run: |
          find dist -type f \( -name '*.deb' -o -name '*.rpm' \) -print0 |
            while IFS= read -r -d '' file; do
              mv "$file" "${file%.*}-x86_64.${file##*.}"
            done

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
