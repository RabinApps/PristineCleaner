name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/update on GitHub Releases"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FASTFORGE_VERSION: 0.6.6

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS dmg
            runner: macos-latest
            release_name: desktop-macos
          - label: Windows exe/msix
            runner: windows-latest
            release_name: desktop-windows
          - label: Linux x86_64 deb/rpm
            runner: ubuntu-latest
            release_name: desktop-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            dpkg-dev \
            fakeroot \
            file \
            libgtk-3-dev \
            ninja-build \
            patchelf \
            pkg-config \
            rpm

      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: npm install -g appdmg

      - name: Install Fastforge
        run: dart pub global activate fastforge $FASTFORGE_VERSION

      - name: Add pub cache to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$LOCALAPPDATA\\Pub\\Cache\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compute release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Build release assets
        run: fastforge release --name ${{ matrix.release_name }} --skip-clean

      - name: Upload artifacts to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: dist/**
          artifactErrorsFailBuild: true
