name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/update on GitHub Releases"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FASTFORGE_VERSION: 0.6.6

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS dmg
            runner: macos-latest
            release_name: desktop-macos
          - label: Windows exe/msix
            runner: windows-latest
            release_name: desktop-windows
          - label: Linux x86_64 deb/rpm
            runner: ubuntu-latest
            release_name: desktop-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            dpkg-dev \
            fakeroot \
            file \
            libgtk-3-dev \
            ninja-build \
            patchelf \
            pkg-config \
            rpm

      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: npm install -g appdmg

      - name: Install Fastforge
        run: dart pub global activate fastforge $FASTFORGE_VERSION

      - name: Add pub cache to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$LOCALAPPDATA\\Pub\\Cache\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compute release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Build macOS app
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        run: flutter build macos --release

      - name: Build release assets
        if: runner.os != 'macOS' || matrix.release_name != 'desktop-macos'
        run: fastforge release --name ${{ matrix.release_name }} --skip-clean

      - name: Sign, notarize, and package macOS release
        if: runner.os == 'macOS' && matrix.release_name == 'desktop-macos'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        run: |
          set -euo pipefail

          # Recreate the certificate file from base64 secret.
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12

          # Use a temporary keychain to avoid interactive prompts in CI.
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          PACKAGING_DIR=""
          APP_NOTARY_ZIP_PATH=""
          cleanup() {
            rm -f certificate.p12
            if [[ -n "$APP_NOTARY_ZIP_PATH" ]]; then
              rm -f "$APP_NOTARY_ZIP_PATH"
            fi
            if [[ -n "$PACKAGING_DIR" ]]; then
              rm -rf "$PACKAGING_DIR"
            fi
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          APP_BUNDLE_PATH="build/macos/Build/Products/Release/PristineCleaner.app"
          APP_NOTARY_ZIP_PATH="$RUNNER_TEMP/PristineCleaner-notarization.zip"
          DIST_DIR="dist/$APP_VERSION"
          DMG_ABS_PATH="$GITHUB_WORKSPACE/$DIST_DIR/pristine_cleaner-$APP_VERSION-macos.dmg"

          if [[ -z "$APP_VERSION" ]]; then
            echo "Could not determine app version from pubspec.yaml"
            exit 1
          fi

          if [[ ! -d "$APP_BUNDLE_PATH" ]]; then
            echo "Could not find PristineCleaner.app to sign"
            exit 1
          fi

          /usr/bin/codesign \
            --force \
            --deep \
            --sign "$MACOS_CERTIFICATE_NAME" \
            --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --verbose \
            "$APP_BUNDLE_PATH"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE_PATH"

          # Notarize and staple the app bundle before packaging it into a DMG.
          ditto -c -k --keepParent "$APP_BUNDLE_PATH" "$APP_NOTARY_ZIP_PATH"
          xcrun notarytool submit \
            "$APP_NOTARY_ZIP_PATH" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$APP_BUNDLE_PATH"
          xcrun stapler validate "$APP_BUNDLE_PATH"

          PACKAGING_DIR="$(mktemp -d)"
          mkdir -p "$DIST_DIR"

          ditto "$APP_BUNDLE_PATH" "$PACKAGING_DIR/PristineCleaner.app"
          cp macos/packaging/dmg/make_config.yaml "$PACKAGING_DIR/make_config.yaml"
          rm -f "$DMG_ABS_PATH"
          (
            cd "$PACKAGING_DIR"
            appdmg make_config.yaml "$DMG_ABS_PATH"
          )

          /usr/bin/codesign \
            --force \
            --sign "$MACOS_CERTIFICATE_NAME" \
            --options runtime \
            --verbose \
            "$DMG_ABS_PATH"

          xcrun notarytool submit \
            "$DMG_ABS_PATH" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$DMG_ABS_PATH"
          xcrun stapler validate "$DMG_ABS_PATH"

      - name: Append x86_64 suffix to Linux artifact names
        if: runner.os == 'Linux' && matrix.release_name == 'desktop-linux-x64'
        shell: bash
        run: |
          find dist -type f \( -name '*.deb' -o -name '*.rpm' \) -print0 |
            while IFS= read -r -d '' file; do
              mv "$file" "${file%.*}-x86_64.${file##*.}"
            done

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
