name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag used in R2 object prefix"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FASTFORGE_VERSION: 0.6.6
  R2_PREFIX_BASE: pristine-cleaner-releases

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS dmg
            runner: macos-latest
            release_name: desktop-macos
          - label: Windows exe/msix
            runner: windows-latest
            release_name: desktop-windows
          - label: Linux x86_64 deb/rpm
            runner: ubuntu-latest
            release_name: desktop-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            dpkg-dev \
            fakeroot \
            file \
            libgtk-3-dev \
            ninja-build \
            patchelf \
            pkg-config \
            rpm

      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: npm install -g appdmg

      - name: Install Fastforge
        run: dart pub global activate fastforge $FASTFORGE_VERSION

      - name: Add pub cache to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$LOCALAPPDATA\\Pub\\Cache\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compute release tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Build release assets
        run: fastforge release --name ${{ matrix.release_name }} --skip-clean

      - name: Prepare artifacts for R2 upload
        shell: bash
        run: |
          set -euo pipefail

          for required in RELEASE_TAG; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required environment variable: $required" >&2
              exit 1
            fi
          done

          if [[ ! -d dist ]]; then
            echo "dist directory not found. Packaging likely failed." >&2
            exit 1
          fi

          upload_root="r2-upload/${RELEASE_TAG}"
          mkdir -p "$upload_root"

          while IFS= read -r file; do
            rel_path="${file#dist/}"
            mkdir -p "${upload_root}/$(dirname "$rel_path")"
            cp "$file" "${upload_root}/${rel_path}"
          done < <(find dist -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msix" -o -name "*.deb" -o -name "*.rpm" \) | sort)

          if [[ -z "$(find "$upload_root" -type f -print -quit)" ]]; then
            echo "No supported artifacts found to upload." >&2
            exit 1
          fi

      - name: Upload artifacts to Cloudflare R2
        id: r2_upload
        uses: ryand56/r2-upload-action@v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: r2-upload
          destination-dir: ${{ env.R2_PREFIX_BASE }}
          output-file-url: true

      - name: Print uploaded artifact URLs
        shell: bash
        run: |
          echo "Uploaded artifact URLs:"
          echo "${{ steps.r2_upload.outputs.file-urls }}"
